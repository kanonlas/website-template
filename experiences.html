<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>experiences | My Portfolio</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-gray-50 text-gray-900">
    <!-- ==================== NAVBAR ==================== -->
    <nav class="sticky top-0 z-50 bg-gray-900 text-white shadow-md">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4"
      >
        <!-- Logo -->
        <a href="index.html" class="text-2xl font-bold hover:text-cyan-400">
          My Portfolio
        </a>

        <!-- Navigation -->
        <ul class="flex gap-6">
          <li>
            <a href="index.html#home" class="hover:text-cyan-400"> Home </a>
          </li>

          <li>
            <a href="index.html#about" class="hover:text-cyan-400"> About </a>
          </li>

          <li>
            <a href="index.html#skills" class="hover:text-cyan-400"> Skills </a>
          </li>

          <li>
            <a href="index.html#projects" class="hover:text-cyan-400">
              Projects
            </a>
          </li>

          <li>
            <a href="experiences.html" class="text-cyan-400"> experiences </a>
          </li>

          <li>
            <a href="index.html#contact" class="hover:text-cyan-400">
              Contact
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- ==================== experiences ==================== -->
    <section class="bg-gray-100 px-6 py-20">
      <div class="mx-auto max-w-6xl">
        <!-- Section Header -->
        <h1 class="text-center text-4xl font-bold">My experiences</h1>

        <p class="mx-auto mt-4 max-w-2xl text-center text-gray-600">
          A collection of competitions, awards, and experiences throughout my
          academic journey.
        </p>

        <!-- ==================== experiences CARDS ==================== -->
        <!-- JavaScript will insert cards here -->
        <div
          id="experiences-list"
          class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3"
        ></div>
      </div>
    </section>

    <!-- ==================== experiences CARD TEMPLATE ==================== -->
    <!--
      This is the reusable design.
      It will NOT appear directly on the page.
      JavaScript will copy it for every experiences.
    -->
    <template id="experiences-template">
      <a
        href="#"
        class="group relative block overflow-hidden rounded-xl bg-black"
      >
        <!-- experiences Image -->
        <img
          src=""
          alt=""
          class="experiences-image h-80 w-full object-cover opacity-75 transition duration-300 group-hover:scale-105 group-hover:opacity-50"
        />

        <!-- Text Overlay -->
        <div class="absolute inset-0 flex flex-col justify-end p-6">
          <!-- Category -->
          <p
            class="experiences-category text-sm font-medium tracking-widest text-pink-400 uppercase"
          ></p>

          <!-- Title -->
          <h2 class="experiences-title mt-2 text-2xl font-bold text-white"></h2>

          <!-- Description -->
          <p
            class="experiences-description mt-3 text-sm text-white opacity-0 transition duration-300 group-hover:opacity-100"
          ></p>
        </div>
      </a>
    </template>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-gray-900 px-6 py-6 text-center text-white">
      <p>
        &copy;
        <span id="year"></span>
        My Portfolio. All rights reserved.
      </p>
    </footer>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script src="app.js"></script>
  </body>
</html>
